name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - codex/dependency-updates
  push:
    branches:
      - main
      - master
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check workspace
        run: npm run typecheck

      - name: Build workspace
        run: npm run build

  runtime-node20:
    name: Verify on Node.js 20
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js 20 runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Remember Node.js 20 executable
        id: runtime-node
        run: node -p '"path=" + process.execPath' >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24 build tools
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packed library on Node.js 20
        env:
          OPEN_TRAINER_RUNTIME_NODE: ${{ steps.runtime-node.outputs.path }}
        run: npm run verify:package

  package:
    name: Verify packed npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packed package
        run: npm run verify:package
