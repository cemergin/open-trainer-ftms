name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - codex/production-hardening
      - codex/dependency-updates
  push:
    branches:
      - main
      - master
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Type-check workspace
        run: npm run typecheck

      - name: Build workspace
        run: npm run build

  quality:
    name: Lint, format, coverage, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require a changeset for publishable package changes
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: npm run changeset:status -- --since="origin/${{ github.base_ref }}"

      - name: Check formatting
        run: npm run format:check

      - name: Run type-aware lint
        run: npm run lint

      - name: Run coverage gates
        run: npm run test:coverage

      - name: Test Trainer Lab qualification reports
        run: npm run test:lab

      - name: Test release gates
        run: npm run test:release-gate

      - name: Audit the complete dependency graph
        run: npm audit --audit-level=high

  runtime-node20:
    name: Verify on Node.js 20
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js 20 runtime
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Remember Node.js 20 executable
        id: runtime-node
        run: node -p '"path=" + process.execPath' >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24 build tools
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packed library on Node.js 20
        env:
          OPEN_TRAINER_RUNTIME_NODE: ${{ steps.runtime-node.outputs.path }}
        run: npm run verify:package

  package:
    name: Verify packed npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify packed package
        run: npm run verify:package
